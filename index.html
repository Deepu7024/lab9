<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Information</title>
<style>
  :root { --ink:#1d2a2f; --muted:#5d6b70; --line:#c9d3d6; --bg:#eef3f4; --accent:#0f6e7a; --stripe:#f6f9fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,"Times New Roman",serif; background:var(--bg); color:var(--ink); padding:24px 16px; }
  .card { max-width:960px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:6px; padding:28px; }
  h1 { margin:0 0 4px; font-size:1.7rem; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:640px; }
  thead th { background:var(--accent); color:#fff; text-align:left; padding:11px 12px; font-weight:bold; }
  td { padding:11px 12px; border-bottom:1px solid var(--line); }
  tbody tr:nth-child(even) { background:var(--stripe); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  th.num { text-align:right; }
  .msg { padding:14px; border:1px solid var(--line); border-radius:4px; color:var(--muted); }
  .msg.error { color:#b3261e; border-color:#b3261e; }
  .picker { margin-top:14px; }
  .count { margin-top:12px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Employee information</h1>
  <p class="sub">Data is read from <code>employees.xml</code> and shown as a table.</p>

  <div id="status" class="msg">Loading employee data…</div>
  <div class="picker" id="picker" hidden>
    <label for="xmlFile">If the file didn't load automatically, choose <code>employees.xml</code>:</label><br>
    <input type="file" id="xmlFile" accept=".xml,text/xml">
  </div>

  <div class="wrap"><table id="empTable" hidden>
    <thead></thead><tbody></tbody>
  </table></div>
  <div class="count" id="count"></div>
</div>

<script>
  const columns = [
    { tag:"id",          label:"ID" },
    { tag:"name",        label:"Name" },
    { tag:"designation", label:"Designation" },
    { tag:"department",  label:"Department" },
    { tag:"salary",      label:"Salary (₹)", numeric:true },
    { tag:"city",        label:"City" }
  ];
  const status = document.getElementById("status");
  const table  = document.getElementById("empTable");

  // Parse XML text and build the table
  function renderXML(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.querySelector("parsererror")) {
      showError("The XML file is not well-formed. Check it for missing or unclosed tags.");
      return;
    }
    const employees = doc.getElementsByTagName("employee");
    if (!employees.length) {
      showError("No <employee> records were found in the XML file.");
      return;
    }

    const head = table.tHead;
    const body = table.tBodies[0];
    head.innerHTML = ""; body.innerHTML = "";

    const hr = head.insertRow();
    columns.forEach(c => {
      const th = document.createElement("th");
      th.textContent = c.label;
      if (c.numeric) th.className = "num";
      hr.appendChild(th);
    });

    Array.from(employees).forEach(emp => {
      const tr = body.insertRow();
      columns.forEach(c => {
        const node = emp.getElementsByTagName(c.tag)[0];
        let text = node ? node.textContent.trim() : "-";
        if (c.numeric && node) text = Number(text).toLocaleString("en-IN");
        const td = tr.insertCell();
        td.textContent = text;
        if (c.numeric) td.className = "num";
      });
    });

    status.hidden = true;
    document.getElementById("picker").hidden = true;
    table.hidden = false;
    document.getElementById("count").textContent = employees.length + " employees";
  }

  function showError(msg) {
    status.hidden = false;
    status.className = "msg error";
    status.textContent = msg;
  }

  // 1) Try to load the XML file with AJAX (works when served over http)
  fetch("employees.xml")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(renderXML)
    .catch(() => {
      // 2) Fallback for files opened directly (file://), where browsers block fetch
      showError("The browser blocked automatic loading. Choose the XML file below.");
      document.getElementById("picker").hidden = false;
    });

  document.getElementById("xmlFile").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => renderXML(reader.result);
    reader.readAsText(file);
  });
</script>
</body>
</html>
